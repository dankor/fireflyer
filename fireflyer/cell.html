<div class="fireflyer-dashboard-cell" style="grid-column: {{ col }}; grid-row: {{ row }};"{% if editing %} data-cid="{{ cid }}"{% endif %}>
  {%- if editing %}
  <div class="fireflyer-chart-tools">
    <button type="button" class="fireflyer-move-btn" data-cid="{{ cid }}" title="Move chart" aria-label="Move {{ cid }}">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M8 1v14M1 8h14M8 1 5.7 3.3M8 1l2.3 2.3M8 15l-2.3-2.3M8 15l2.3-2.3M1 8l2.3-2.3M1 8l2.3 2.3M15 8l-2.3-2.3M15 8l-2.3 2.3" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="fireflyer-edit-btn" data-cid="{{ cid }}" title="Edit chart" aria-label="Edit {{ cid }}">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M11.1 1.9a1.5 1.5 0 0 1 2.1 0l.9.9a1.5 1.5 0 0 1 0 2.1l-8 8-3.4.9.9-3.4 7.5-8.5z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="fireflyer-delete-btn" data-cid="{{ cid }}" title="Delete chart" aria-label="Delete {{ cid }}">
      <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M2.5 4h11M6 4V2.6h4V4M5 4l.6 9.4h4.8L11 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"/></svg>
    </button>
  </div>
  {%- endif %}
  {{ panel|safe }}
  {{ chart_html|safe }}
</div>
