<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fireflyer</title>
<!-- Pinned htmx, vendored (scripts/vendor.py) so the editor needs no network.
     Loaded once here so charts embedded via innerHTML can use hx-* attributes
     without each chart shipping its own script. -->
<script src="/static/vendor/htmx@1.9.12.min.js"></script>
<!-- The YAML pane's code editor: CodeMirror 6, as browser ES modules served
     from static/vendor — no npm, no build, no network: scripts/vendor.py
     downloaded these exact files once. The import map gives every package one
     URL, so each is loaded once: CodeMirror's own type checks fail if two
     copies of @codemirror/state meet. Should any of it fail to load, the
     plain textarea under it stays and works (static/yaml-editor.js). -->
<script type="importmap">
{"imports": {
  "@codemirror/state": "/static/vendor/codemirror-state@6.7.6.mjs",
  "@codemirror/view": "/static/vendor/codemirror-view@6.43.14.mjs",
  "@codemirror/commands": "/static/vendor/codemirror-commands@6.11.1.mjs",
  "@codemirror/language": "/static/vendor/codemirror-language@6.13.1.mjs",
  "@codemirror/search": "/static/vendor/codemirror-search@6.7.2.mjs",
  "@codemirror/autocomplete": "/static/vendor/codemirror-autocomplete@6.20.3.mjs",
  "@codemirror/lint": "/static/vendor/codemirror-lint@6.9.7.mjs",
  "@codemirror/lang-yaml": "/static/vendor/codemirror-lang-yaml@6.1.3.mjs",
  "@codemirror/merge": "/static/vendor/codemirror-merge@6.12.2.mjs",
  "@codemirror/streamparser": "/static/vendor/codemirror-streamparser@6.0.0.mjs",
  "@lezer/common": "/static/vendor/lezer-common@1.5.3.mjs",
  "@lezer/lr": "/static/vendor/lezer-lr@1.4.11.mjs",
  "@lezer/yaml": "/static/vendor/lezer-yaml@1.0.4.mjs",
  "@lezer/highlight": "/static/vendor/lezer-highlight@1.2.5.mjs",
  "style-mod": "/static/vendor/style-mod@4.1.4.mjs",
  "w3c-keyname": "/static/vendor/w3c-keyname@2.2.8.mjs",
  "crelt": "/static/vendor/crelt@1.0.7.mjs",
  "@marijn/find-cluster-break": "/static/vendor/marijn-find-cluster-break@1.0.4.mjs",
  "fireflyer/diff-view": "__FF_DIFF_VIEW__"
}}
</script>
__FF_STYLES__
</head>
<body data-dash-id="__FF_DASH_ID__">
<header class="topbar">
  <div class="topbar-left">
    __FF_NAV__
    __FF_MODES__
    __FF_DASH_NAME__
  </div>
  <div class="topbar-right">
    __FF_PATHDD__
    <!-- Compare versions: the saved history and what's unsaved, side by side. -->
    __FF_SAVE__
    __FF_THEME__
    __FF_USER_MENU__
  </div>
  <button type="button" class="ff-move-discard" id="ff-move-cancel" hidden title="Cancel move (Esc)" aria-label="Cancel move (Esc)">✕ (Esc)</button>
</header>
<div class="layout mode-view" id="layout">
  <section class="pane output" id="output-pane">
    <div class="pane-body"><div id="output"></div></div>
    <!-- Shown (over a greyed-out, stale preview) only after a manual YAML edit. -->
    <button type="button" class="ff-refresh" id="refresh" title="Refresh preview (⌘/Ctrl+Enter)">↻ Refresh</button>
  </section>
  <!-- The panels. One per mode, all the same shell, all over the canvas. -->
  <!-- The dashboard's source. Every control reads and writes it — the chart
       modals, the calcs manager, chat, save — and `code` mode is where you
       read and edit it by hand. -->
  <div class="ff-split" id="ff-split" title="Drag to resize"></div>
  <!-- No header: the lit segment already says this is the YAML, and the pane is
       unmistakably a text editor. The other panels keep theirs — their contents
       are not self-describing. -->
  <aside class="ff-docs ff-panel" id="ff-yaml" hidden>
    <div class="pane-body">
      <textarea id="code" spellcheck="false" autocomplete="off">__FF_YAML_CONTENT__</textarea>
    </div>
  </aside>
  <!-- AI assistant: knows the YAML + the dataset schemas. -->
  <aside class="ff-docs ff-panel ff-chat" id="ff-chat" hidden>__FF_CHAT__
  </aside>
  <!-- Chart reference: each chart's spec.md. -->
  <aside class="ff-docs ff-panel" id="ff-docs" hidden>
    <div class="ff-docs-body">__FF_DOCS__</div>
  </aside>
  <!-- Calcs manager: add/edit/delete calcs. -->
  <aside class="ff-docs ff-panel" id="ff-calcs" hidden>
    <div class="ff-docs-body" id="ff-calcs-body"></div>
  </aside>
</div>
<div class="ff-modal-overlay" id="ff-modal-overlay">
  <div class="ff-modal" id="ff-modal"></div>
</div>
<div class="ff-addmenu" id="ff-addmenu" hidden>
  <button type="button" data-add-kind="chart">Chart…</button>
  <button type="button" data-add-kind="header">Header</button>
  <button type="button" data-add-kind="separator">Separator</button>
  <button type="button" data-add-kind="tab">Tab</button>
</div>
<!-- Compare versions (static/diff-view.js): two YAMLs side by side, each side
     any saved version or what's in the editor now. Over the whole workspace,
     under the topbar. -->
<section class="ff-diff" id="ff-diff" hidden aria-label="Compare versions">
  <div class="ff-diff-bar">
    <select class="ff-diff-pick" id="ff-diff-a" aria-label="Left side"></select>
    <button type="button" class="ff-diff-icon" id="ff-diff-swap" title="Swap sides" aria-label="Swap sides">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>
    </button>
    <select class="ff-diff-pick" id="ff-diff-b" aria-label="Right side"></select>
    <span class="ff-diff-stats" id="ff-diff-stats"></span>
    <button type="button" class="ff-diff-restore" id="ff-diff-restore" hidden></button>
  </div>
  <div class="ff-diff-body" id="ff-diff-body"></div>
</section>
<!-- Transient error toast (replaces the old topbar status text). -->
<div class="ff-toast" id="ff-toast" hidden></div>
__FF_SCRIPT__
</body>
</html>
