<style>/* ── Theme tokens ───────────────────────────────────────────────────────────
   Light + dark palettes as CSS custom properties. Selection is automatic
   (prefers-color-scheme) unless a `data-ff-theme="light|dark"` attribute on this
   chart, its `.fireflyer-chart-root` wrapper, or any ancestor (e.g. the
   dashboard, or <html> in the editor) overrides it. Mirrored across every
   chart.css and dashboard.css — no shared stylesheet by design (architecture.md,
   "Theming"). Keep the palettes in sync. */
.fireflyer-chart {
  --ff-ink: #20242b;
  --ff-title: #323232;
  --ff-muted: #5e6975;
  --ff-faint: #8a929c;
  --ff-panel: #ffffff;
  --ff-border: #e0e0e0;
  --ff-border-strong: #d6d8dc;
  --ff-accent: #20a7c9;
  --ff-tooltip-bg: #20242b;
  --ff-tooltip-ink: #ffffff;
  --ff-shadow: rgba(0, 0, 0, 0.04);
  --ff-shadow-strong: rgba(0, 0, 0, 0.18);
}
@media (prefers-color-scheme: dark) {
  .fireflyer-chart {
    --ff-ink: #e6e8ec;
    --ff-title: #f2f4f7;
    --ff-muted: #a3adbd;
    --ff-faint: #7f8a99;
    --ff-panel: #1b2635;
    --ff-border: #2c384a;
    --ff-border-strong: #3a475c;
    --ff-accent: #20a7c9;
    --ff-tooltip-bg: #0c1320;
    --ff-tooltip-ink: #e6e8ec;
    --ff-shadow: rgba(0, 0, 0, 0.4);
    --ff-shadow-strong: rgba(0, 0, 0, 0.55);
  }
}
[data-ff-theme="light"] .fireflyer-chart,
.fireflyer-chart[data-ff-theme="light"] {
  --ff-ink: #20242b;
  --ff-title: #323232;
  --ff-muted: #5e6975;
  --ff-faint: #8a929c;
  --ff-panel: #ffffff;
  --ff-border: #e0e0e0;
  --ff-border-strong: #d6d8dc;
  --ff-accent: #20a7c9;
  --ff-tooltip-bg: #20242b;
  --ff-tooltip-ink: #ffffff;
  --ff-shadow: rgba(0, 0, 0, 0.04);
  --ff-shadow-strong: rgba(0, 0, 0, 0.18);
}
[data-ff-theme="dark"] .fireflyer-chart,
.fireflyer-chart[data-ff-theme="dark"] {
  --ff-ink: #e6e8ec;
  --ff-title: #f2f4f7;
  --ff-muted: #a3adbd;
  --ff-faint: #7f8a99;
  --ff-panel: #1b2635;
  --ff-border: #2c384a;
  --ff-border-strong: #3a475c;
  --ff-accent: #20a7c9;
  --ff-tooltip-bg: #0c1320;
  --ff-tooltip-ink: #e6e8ec;
  --ff-shadow: rgba(0, 0, 0, 0.4);
  --ff-shadow-strong: rgba(0, 0, 0, 0.55);
}

.fireflyer-chart {
  font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  color: var(--ff-ink);
  background: var(--ff-panel);
  border: 1px solid var(--ff-border);
  border-radius: 4px;
  padding: 16px 20px;
  box-shadow: 0 1px 2px var(--ff-shadow);
  margin: 0 0 16px 0;
}
.fireflyer-chart .fireflyer-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--ff-title);
  letter-spacing: -0.01em;
  margin: 0 0 12px 0;
}
/* Flex column so the layout below the title can fill the card's height
   and center its content when the dashboard row is tall. */
.fireflyer-pie {
  display: flex;
  flex-direction: column;
  /* Distance from a slice's outer edge to its tooltip. Both placement paths
     (transform-based and anchored) read it, so they can't drift apart. */
  --ff-tip-gap: 8px;
}
.fireflyer-pie-layout {
  flex: 1 1 auto;
  /* min-height: 0 lets the layout shrink below its content size, so the legend
     below can be given the leftover height to scroll inside. */
  min-height: 0;
  /* The **legend** scrolls, not the chart. Scrolling the whole layout (what
     this used to do) pushed the donut out of view to reach the categories;
     keeping the donut put and scrolling just the list is what a long legend
     actually wants. */
  overflow: hidden;
  display: flex;
  gap: 24px;
  /* `stretch` on both axes so the legend inherits a definite height to scroll
     within — side by side it fills the row, and once it wraps below the donut
     it takes the leftover line. `align-content` is what splits the height
     between the two wrapped lines. */
  flex-direction: column;
  align-items: center;
  justify-content: safe center;
}
.fireflyer-pie-canvas {
  position: relative;
  width: 220px;
  height: 220px;
  flex-shrink: 0;
  /* The layout stretches its items so the legend can inherit a height; the
     donut has a fixed size, so centre it in whatever space it's given. */
  align-self: center;
}
.fireflyer-pie svg { display: block; }
/* Slice separators and the donut hole take the card colour so slices read as
   distinct on any theme (each slice's fill is data-driven, set inline). Only
   multi-slice paths get a separator stroke; a lone full-circle slice has none. */
.fireflyer-pie svg path { stroke: var(--ff-panel); }
.fireflyer-pie-hole { fill: var(--ff-panel); }
/* Grand total in the donut centre. Not a pointer target — the click surface is
   the slices, so it never eats slice hovers/clicks. */
.fireflyer-pie-total { fill: var(--ff-ink); font-size: 24px; font-weight: 700;
  pointer-events: none; }
/* Percent label drawn on each big-enough slice (small slices are skipped). White
   with a faint dark halo so it stays legible over any slice colour. */
.fireflyer-pie-pct {
  fill: #ffffff;
  font-size: 12px;
  font-weight: 600;
  pointer-events: none;
  /* A soft shadow (not a thick outline) keeps the label crisp on any slice
     colour without the chunky look of a wide stroke halo. */
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
}
/* Highlight box behind a slice's percent label, revealed while that slice is
   hovered (see the per-slice reveal rules in the template). */
.fireflyer-pie-pct-bg {
  fill: rgba(0, 0, 0, 0.6);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
}
.fireflyer-pie svg path,
.fireflyer-pie svg circle[data-i] {
  cursor: pointer;
  /* Scale a hovered slice radially from the donut centre so it pops out. */
  transform-box: view-box;
  transform-origin: center;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.fireflyer-pie svg path:hover,
.fireflyer-pie svg circle[data-i]:hover { transform: scale(1.05); filter: brightness(1.08); }
/* When the chart has at least one slice selected via crossfilter, fade the
   unselected slices so the active selection reads at a glance. */
.fireflyer-pie.has-selection [data-active="0"] { opacity: 0.35; }
.fireflyer-pie.has-selection .fireflyer-legend li:not(.active) { opacity: 0.55; }
.fireflyer-pie.has-selection .fireflyer-legend li.active .label { font-weight: 600; }
.fireflyer-pie-tooltip {
  position: absolute;
  /* Per-slice placement (its outer-edge mid-angle point) arrives as custom
     properties, not inline `left`/`top`: an inline declaration outranks any
     stylesheet rule, so the anchored block below could not override it and the
     canvas coordinates leaked into `position: fixed` — resolving against the
     viewport and throwing the card into the page corner. Through a variable the
     override is a plain stylesheet-vs-stylesheet cascade. */
  left: var(--ff-tip-x, 50%);
  top: var(--ff-tip-y, 50%);
  /* The `--rt/rb/lt/lb` quadrant class then offsets the card outward from the
     centre — horizontally away, vertically hanging into the canvas — so it sits
     next to the hovered slice and stays on-screen. */
  width: max-content;
  max-width: 240px;
  pointer-events: none;
  background: var(--ff-tooltip-bg);
  color: var(--ff-tooltip-ink);
  font-size: 12px;
  line-height: 1.4;
  text-align: left;
  padding: 7px 10px;
  border-radius: 6px;
  box-shadow: 0 6px 18px var(--ff-shadow-strong);
  opacity: 0;
  transition: opacity 0.12s ease;
  z-index: 7;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
/* The card sits beside the donut on its slice's side, vertically centred on the
   slice. One gap value for both placement paths — the anchored block at the
   bottom of this file repeats this geometry with inset properties. */
.fireflyer-pie-tooltip--r { transform: translate(var(--ff-tip-gap), -50%); }
.fireflyer-pie-tooltip--l {
  transform: translate(calc(-100% - var(--ff-tip-gap)), -50%);
}
/* Category name as a header, then a `calc · value · percent` row and an
   optional calc description. */
.fireflyer-pie-tooltip-head {
  font-weight: 600;
  font-size: 13px;
  letter-spacing: -0.01em;
  padding-bottom: 6px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.16);
}
.fireflyer-pie-tooltip-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 14px;
  font-variant-numeric: tabular-nums;
}
.fireflyer-pie-tooltip-name { opacity: 0.7; margin-right: auto; }
.fireflyer-pie-tooltip-val { font-weight: 600; }
.fireflyer-pie-tooltip-pct { opacity: 0.85; }
.fireflyer-pie-tooltip-desc { opacity: 0.7; font-size: 11.5px; line-height: 1.4; }
/* Centre-total tooltip — shown (CSS-only) when the calc has a description:
   the calc name, its description, and the exact grand total. It hangs *below*
   the donut (not over it) so it never covers the ring; a transparent hit circle
   in the hole gives a large hover target on the total. */
.fireflyer-pie-total-hit { fill: transparent; pointer-events: all; cursor: default; }
.fireflyer-pie-total-tip {
  position: absolute;
  left: 50%;
  top: calc(100% + 8px);
  transform: translateX(-50%);
  width: max-content;
  max-width: 240px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: left;
  background: var(--ff-tooltip-bg);
  color: var(--ff-tooltip-ink);
  padding: 10px 13px;
  border-radius: 6px;
  box-shadow: 0 6px 18px var(--ff-shadow-strong);
  font-size: 12px;
  line-height: 1.45;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s ease;
  z-index: 3;
}
.fireflyer-pie-canvas:has(.fireflyer-pie-total-hit:hover) .fireflyer-pie-total-tip,
.fireflyer-pie-canvas:has(.fireflyer-pie-total:hover) .fireflyer-pie-total-tip { opacity: 1; }
.fireflyer-pie-total-tip-name { font-weight: 600; font-size: 13px; letter-spacing: -0.01em; }
.fireflyer-pie-total-tip-desc { opacity: 0.82; }
.fireflyer-pie-total-tip-value {
  margin-top: 5px;
  padding-top: 5px;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  white-space: nowrap;
}
/* Tooltips escape the chart/scroll frame via CSS anchor positioning (no JS): a
   `position: fixed` tooltip anchored to its slice/total is clipped by nothing,
   and a position-try fallback flips it above when there's no room below — so it
   never truncates. Progressive enhancement — browsers without anchor positioning
   keep the in-flow placement above. See fireflyer/chart/SKILL.md, "Tooltips". */
.fireflyer-pie-tip-anchor {
  width: 1px;
  height: 1px;
  pointer-events: none;
}
@supports (anchor-name: --a) {
  .fireflyer-pie { anchor-scope: all; }
  /* The anchored placement repeats the quadrant geometry above rather than
     replacing it with a single centred-below position. The anchor is the
     slice's *outer edge*, so a card centred under it covers the donut for every
     slice on the left half and reads as detached from the slice it names —
     which is what it did. Keeping both paths on one geometry also means the
     card lands in the same place whether or not the browser has anchor
     positioning; only the clipping behaviour differs.

     The offset moves from `transform` into the inset properties because
     `flip-inline`/`flip-block` mirror insets and can't mirror a transform. */
  .fireflyer-pie-tooltip {
    position: fixed;
    inset: auto;
    /* Vertical centring stays a transform (no inset expresses "centre on the
       anchor"); the horizontal offset is an inset so `flip-inline` can mirror
       it. */
    top: anchor(center);
    transform: translateY(-50%);
    /* Near a screen edge, mirror to whichever side has room. */
    position-try-fallbacks: flip-inline;
  }
  /* The anchor is 1px, so its edges are one point: `anchor(right)` and
     `anchor(left)` differ only in which card edge they align. */
  .fireflyer-pie-tooltip--r { left: calc(anchor(right) + var(--ff-tip-gap)); }
  .fireflyer-pie-tooltip--l { right: calc(anchor(left) + var(--ff-tip-gap)); }
  /* The total's marker sits at the bottom of the ring (see chart.html), so the
     card hangs below the donut rather than out of its middle. */
  .fireflyer-pie-total-tip {
    position: fixed;
    inset: auto;
    position-anchor: --ff-pie-total;
    top: calc(anchor(bottom) + var(--ff-tip-gap));
    left: anchor(center);
    transform: translateX(-50%);
    position-try-fallbacks: flip-block;
  }
}
/* The legend is a single row above the donut with a pager on the right, rather
   than a tall column beside it: the donut is a fixed 220px square, so width
   spent on a legend column is width the chart can't use, while a row costs one
   line of height. Entries beyond a page are reached with the pager — the donut
   itself always shows every slice, so paging never hides data. */
.fireflyer-pie-legend-bar {
  order: -1;
  flex: none;
  align-self: center;
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 100%;
}
.fireflyer-pie .fireflyer-legend {
  list-style: none;
  padding: 0;
  margin: 0;
  font-size: 13px;
  color: var(--ff-ink);
  display: flex;
  flex-flow: row nowrap;
  align-items: center;
  gap: 16px;
  min-width: 0;
}
.fireflyer-pie-legend-pager {
  display: flex;
  flex: none;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: var(--ff-muted);
  font-variant-numeric: tabular-nums;
}
.fireflyer-pie-legend-step {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ff-muted);
  font: inherit;
  font-size: 10px;
  line-height: 1;
  padding: 3px;
  cursor: pointer;
  border-radius: 3px;
}
.fireflyer-pie-legend-step:hover:not(:disabled) {
  color: var(--ff-title);
  background: color-mix(in srgb, var(--ff-border) 50%, transparent);
}
.fireflyer-pie-legend-step:disabled { opacity: 0.3; cursor: default; }
.fireflyer-pie .fireflyer-legend li {
  display: flex;
  align-items: center;
  padding: 3px 0;
  white-space: nowrap;
}
/* Inside a dashboard the legend crossfilters like the slices: a click toggles
   the category. Give the rows a pointer + hover affordance. */
.fireflyer-pie .fireflyer-legend-clickable li {
  cursor: pointer;
  padding: 3px 5px;
  margin: 0 -5px;
  border-radius: 4px;
  transition: background 0.12s ease;
}
.fireflyer-pie .fireflyer-legend-clickable li:hover { background: rgba(127, 127, 127, 0.14); }
.fireflyer-pie .fireflyer-legend-clickable li:focus-visible {
  outline: 2px solid var(--ff-accent);
  outline-offset: -1px;
}
.fireflyer-pie .fireflyer-legend .swatch {
  display: inline-block;
  width: 12px;
  height: 12px;
  border-radius: 2px;
  margin-right: 8px;
  flex-shrink: 0;
}
.fireflyer-pie .fireflyer-legend .label { color: var(--ff-ink); }
</style>

.fireflyer-pie-canvas:has(svg [data-i="1"]:hover) .fireflyer-pie-tooltip[data-i="1"],
.fireflyer-pie-canvas:has(svg [data-i="1"]:hover) .fireflyer-pie-pct-bg[data-i="1"] { opacity: 1; }
</style>
