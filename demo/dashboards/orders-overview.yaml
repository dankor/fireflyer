# ==========================================================================
#  Orders overview - a guided tour of Fireflyer, one feature at a time.
#
#  Everything is commented; edit anything and the preview re-renders. The top
#  bar's chips (code mode) jump to each section.
#
#    name / description   the title, and the line under it
#    calcs                named values and dimensions, per dataset
#    charts               what to draw
#    layout               where to draw it: rows, tabs, headers, spans
#    datasets             the data itself, inline (or upload it instead)
# ==========================================================================

name: Orders overview
description: Orders, revenue and where they come from - a tour of every chart type.

# ---- CALCS -----------------------------------------------------------------
# Keyed by DATASET, then by calc key. A chart names a calc instead of carrying
# its own aggregation. The kind is never written - it's read from the shape:
#
#   has `agg:`                    AGGREGATE  a value, reduced per group
#   formula over other calcs      DERIVED    a value computed from values
#   formula over columns          COLUMN     a dimension, usable as a column
#
# `name` is what a viewer reads; `description` is its tooltip; `format` is
# `<prefix><0, 0.0, 0.00...>[a]<suffix>` - `a` abbreviates (24800 -> 24.8k).
calcs:
  orders:
    # COLUMN. Keyed like a real column, it relabels it in place: `status` is
    # still `status` to every chart and filter - only the header text changes.
    status:
      name: Order status
      description: How far the order got - paid, shipped, refunded...
      formula: status
    # str2dt() makes text a real date: a time axis, with a grain picker.
    order_day:
      name: Order day
      formula: str2dt(day, YYYY-MM-DD)

    # AGGREGATE: count / sum / avg / min / max / dcount over any formula.
    order_count: {name: Orders, agg: count}
    revenue:
      name: Revenue
      description: Units times unit price, summed
      agg: sum
      formula: unit_price * qty       # a row-level expression, not just a column
      format: 0.0a $
    avg_unit_price: {name: Avg unit price, agg: avg, formula: unit_price, format: 0.00$}
    smallest_order: {name: Smallest, agg: min, formula: amount, format: 0.00$}
    biggest_order: {name: Biggest, agg: max, formula: amount, format: 0$}
    channels: {name: Channels, description: Distinct channels selling, agg: dcount, formula: channel}
    # `filters:` on a calc = conditional aggregation: only ever paid rows.
    paid_revenue:
      name: Paid revenue
      agg: sum
      formula: amount
      format: 0.0a $
      filters: [{column: status, op: in, values: [paid]}]
    paid_count:
      name: Paid orders
      agg: count
      filters: [{column: status, op: in, values: [paid]}]

    # DERIVED: per group, after the aggregates - a true per-group ratio.
    avg_order_value: {name: Avg order, formula: revenue / order_count, format: 0.00$}
    paid_rate:
      name: Paid share
      formula: paid_count / order_count * 100    # `%` is a suffix: scale here
      format: 0.0%

  # Calcs of another dataset live under its own key.
  visits:
    sessions: {name: Sessions, agg: sum, formula: sessions, format: 0a}

# ---- CHARTS ----------------------------------------------------------------
# Each needs `type` and `dataset`; most take a `calc`. Optional on every one:
#   title, description (shown in its filter panel - the badge, top right)
#   filters - BUILT-IN filters, part of the chart: always on, never removable
#     {column: c, op: in,      values: [a, b]}    one of
#     {column: c, op: ni,      values: [a, b]}    none of
#     {column: c, op: between, values: [lo, hi]}  dates: lo <= v < hi
#                                                 numbers: lo <= v <= hi
# Click a slice, bar or row to crossfilter the rest; the badge counts filters.
charts:
  # NUMBER - one figure in its calc's format; hover for the exact value.
  total_orders:
    type: number
    dataset: orders
    title: Orders
    description: Every order placed, cancelled ones included.
    calc: order_count
  paid_kpi: {type: number, dataset: orders, title: Paid revenue, calc: paid_revenue}
  avg_order: {type: number, dataset: orders, title: Avg order, calc: avg_order_value}
  refunds:
    type: number
    dataset: orders
    title: Refunded orders
    calc: order_count
    filters: [{column: status, op: in, values: [refunded]}]
  may_revenue:
    type: number
    dataset: orders
    title: Revenue in May
    calc: revenue
    filters: [{column: day, op: between, values: ['2026-05-01', '2026-06-01']}]
  paid_share: {type: number, dataset: orders, title: Paid share, calc: paid_rate}

  # BAR - `x` groups, `y` (optional) stacks. A date `x` picks its own grain.
  by_day:
    type: bar
    dataset: orders
    title: Orders by day, by status
    x: order_day
    y: status
    calc: order_count
  # `top` keeps the N biggest; `direction: vertical` lays the bars sideways.
  top_channels:
    type: bar
    dataset: orders
    title: Top 5 channels by revenue
    x: channel
    calc: revenue
    top: 5
    direction: vertical
  # The other dataset: its own calc, its own filters.
  sessions:
    type: bar
    dataset: visits
    title: Sessions by channel
    x: channel
    calc: sessions

  # PIE - `column` slices, `calc` sizes them; the centre shows the total.
  status_pie:
    type: pie
    dataset: orders
    title: Revenue by status
    column: status
    calc: revenue
  # `ni` drops cancelled orders; `total: false` empties the centre. Eight
  # channels outgrow the legend, so it pages.
  channel_pie:
    type: pie
    dataset: orders
    title: Orders by channel, not cancelled
    column: channel
    calc: order_count
    total: false
    filters: [{column: status, op: ni, values: [cancelled]}]

  # MAP - a hex heatmap of lat/lng points; `grid_size` sets the hex size (and
  # `zoom` would pin the tile zoom, which otherwise fits the data).
  density:
    type: map
    dataset: orders
    title: Where orders come from (Kyiv)
    lat: lat
    lng: lng
    grid_size: 16
    calc: order_count

  # TABLE, grouped: `measures` makes `columns` the grouping keys.
  by_status:
    type: table
    dataset: orders
    title: By status
    columns: [status]
    measures: [order_count, revenue, avg_order_value, biggest_order]
    sort: ['-revenue']            # `-` descending
    pagination: 0                 # 0 = every row, no pager
    search: false
  # `measures` without `columns`: one row of grand totals.
  totals:
    type: table
    dataset: orders
    title: Everything, totalled
    measures: [order_count, channels, smallest_order, avg_unit_price, paid_rate]
    search: false
  # TABLE, raw: one row per record - `columns` picks and orders them.
  big_orders:
    type: table
    dataset: orders
    title: Orders from 150 to 450, biggest first
    columns: [order_day, status, channel, qty, amount]
    sort: ['-amount']
    pagination: 5
    filters: [{column: amount, op: between, values: [150, 450]}]
  all_orders: {type: table, dataset: orders, title: All orders, pagination: 8}

# ---- LAYOUT ----------------------------------------------------------------
# Rows, top to bottom: ["@<height>", "<chart>:<width>", ...]. Widths are
# relative (`a:2, b:1` is two thirds / one third); a bare id takes 1.
#   "Some text"   a header        "-"   a rule
# SPAN: repeat a chart BARE in the next row and it grows down into it; the
# other cells of that row share what's left (below: two numbers under the bar,
# beside the tall pie).
# Named keys instead of a list make TABS.
layout:
  Overview:
    - "How the business is doing"
    - ["@20", "total_orders", "paid_kpi", "avg_order", "refunds"]
    - ["@40", "by_day:65", "status_pie:35"]
    - ["@18", "may_revenue", "paid_share", "status_pie"]
    - "-"
    - "Where the orders are"
    - ["@80", "density"]

  Breakdowns:
    - ["@42", "top_channels:55", "channel_pie:45"]
    - ["@36", "by_status:60", "totals:40"]
    - "Traffic, from a second dataset"
    - ["@30", "sessions"]

  Orders:
    - ["@44", "big_orders"]
    - ["@56", "all_orders"]

